services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ideal_year
      POSTGRES_USER: ideal_year
      POSTGRES_PASSWORD: ideal_year_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideal_year -d ideal_year"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://ideal_year:ideal_year_local_only@postgres:5432/ideal_year
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://ideal_year:ideal_year_local_only@postgres:5432/ideal_year
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
